  <meta name="description" content="Tardeos, fiestas, conciertos y eventos en Valencia">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Fuente: Plus Jakarta Sans (títulos y texto) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    try {
      if (localStorage.getItem('planvlc-theme') === 'dark') document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
