<section class="flex min-h-screen items-center justify-center bg-gris-50 px-4 py-12">
  <div class="w-full max-w-md">
    <a routerLink="/" class="mb-8 flex items-center justify-center gap-2.5 text-2xl font-extrabold tracking-tight text-gris-900" aria-label="PlanVLC, ir al inicio">
      <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-marca-500 to-marca-700 text-white shadow-sm" aria-hidden="true"><svg lucideMapPin width="20" height="20"></svg></span>
      <span>Plan<span class="text-marca-600">VLC</span></span>
    </a>

    <div class="rounded-2xl border border-gris-200 bg-superficie p-6 shadow-sm sm:p-8">
      <h1 class="text-2xl font-bold text-gris-900">Crear cuenta</h1>
      <p class="mb-6 mt-1 text-sm text-gris-500">Crea tu cuenta de PlanVLC para descubrir los mejores planes de Valencia.</p>

      @if (error()) {<div class="mb-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700" role="alert">{{ error() }}</div>}
      <app-register-form [submitting]="submitting()" [serverErrors]="serverErrors()" (formSubmit)="onSubmit($event)" />

      <p class="mt-6 text-center text-sm text-gris-500">¿Ya tienes cuenta? <a routerLink="/login" class="font-semibold text-marca-700 hover:underline">Inicia sesión</a></p>
    </div>
  </div>
</section>
