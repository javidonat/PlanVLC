<section class="mx-auto max-w-7xl px-4 py-9 sm:px-6 lg:px-8">
  <header class="mb-8 flex flex-wrap items-start justify-between gap-4">
    <div>
      <p class="mb-1 text-sm font-semibold text-marca-600">Panel de administración</p>
      <h1 class="text-3xl font-bold tracking-tight text-gris-900">Planes</h1>
      <p class="mt-2 text-gris-500">Gestiona los planes de Valencia. Las fechas y precios salen de sus sesiones.</p>
    </div>
    <a routerLink="nuevo" class="inline-flex items-center gap-2 rounded-xl bg-marca-600 px-5 py-3 font-semibold text-white shadow-sm hover:bg-marca-700"><svg lucidePlus width="18" height="18"></svg> Nuevo plan</a>
  </header>

  @if (store.loading()) {
    <app-skeleton-loader [count]="5" label="Cargando planes" />
  } @else if (store.error(); as error) {
    <app-error-state [message]="error" (retry)="load()" />
  } @else if (store.isEmpty()) {
    <app-empty-state message="Todavía no hay planes." />
  } @else {
    <app-plan-table
      [plans]="store.items()"
      [busyId]="store.busyId()"
      (viewPlan)="onView($event)"
      (editPlan)="onEdit($event)"
      (togglePlan)="onToggle($event)"
      (deletePlan)="onDelete($event)"
    />
  }
</section>
