<section class="mx-auto max-w-7xl px-4 py-9 sm:px-6 lg:px-8">
  <header class="mb-8 flex flex-wrap items-start justify-between gap-4">
    <div>
      <p class="mb-1 text-sm font-semibold text-marca-600">Panel de administración</p>
      <h1 class="text-3xl font-bold tracking-tight text-gris-900">Organizadores</h1>
      <p class="mt-2 text-gris-500">Quién organiza los planes: discotecas, empresas, clubs y promotoras.</p>
    </div>
    <a routerLink="nuevo" class="inline-flex items-center gap-2 rounded-xl bg-marca-600 px-5 py-3 font-semibold text-white shadow-sm hover:bg-marca-700"><svg lucidePlus width="18" height="18"></svg> Nuevo organizador</a>
  </header>

  @if (store.loading()) {
    <app-skeleton-loader [count]="5" label="Cargando organizadores" />
  } @else if (store.error(); as error) {
    <app-error-state [message]="error" (retry)="load()" />
  } @else if (store.isEmpty()) {
    <app-empty-state message="Todavía no hay organizadores." />
  } @else {
    <app-organizer-table
      [organizers]="store.items()"
      [busyId]="store.busyId()"
      (viewOrganizer)="onView($event)"
      (editOrganizer)="onEdit($event)"
      (toggleOrganizer)="onToggle($event)"
      (deleteOrganizer)="onDelete($event)"
    />
  }
</section>
