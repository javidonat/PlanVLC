<section class="mx-auto max-w-3xl px-4 py-9 sm:px-6">
  <a routerLink="/admin/organizadores" class="text-sm font-semibold text-marca-700 hover:underline">← Volver a organizadores</a>
  <div class="mb-7 mt-5">
    <p class="text-sm font-semibold text-marca-600">Administración</p>
    <h1 class="mt-2 text-3xl font-bold text-gris-900">Editar organizador</h1>
    <p class="mt-2 text-gris-500">{{ organizer()?.name || 'Completa los datos del organizador.' }}</p>
  </div>

  @if (pageLoading()) {
    <app-skeleton-loader [count]="4" label="Cargando organizador" />
  } @else if (loadError(); as message) {
    <app-error-state [message]="message" (retry)="loadPage()" />
  } @else if (organizer(); as current) {
    @if (error()) {<div class="mb-4 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700" role="alert">{{ error() }}</div>}
    <app-organizer-form
      [organizer]="current"
      [users]="users()"
      [submitting]="submitting()"
      [serverErrors]="serverErrors()"
      (formSubmit)="onSubmit($event)"
      (cancelClick)="router.navigate(['/admin/organizadores'])"
    />
  }
</section>
