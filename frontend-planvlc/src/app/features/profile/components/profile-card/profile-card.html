<div class="rounded-2xl border border-gris-200 bg-white p-5 shadow-sm sm:p-8">
  <div class="flex items-center gap-4">
    <span class="flex h-16 w-16 shrink-0 items-center justify-center rounded-full bg-marca-100 text-xl font-bold text-marca-700" aria-hidden="true">{{ initials() }}</span>
    <div class="min-w-0">
      <h2 class="truncate text-xl font-bold text-gris-900">{{ user().name }}</h2>
      <p class="truncate text-gris-500">{{ user().email }}</p>
      <span class="mt-2 inline-block rounded-full bg-marca-50 px-2.5 py-1 font-mono text-xs font-semibold text-marca-700">{{ user().role }}</span>
    </div>
  </div>

  <dl class="mt-6 grid gap-x-6 gap-y-4 border-t border-gris-100 pt-6 text-sm sm:grid-cols-2">
    <div><dt class="font-semibold text-gris-500">Nombre completo</dt><dd class="mt-1 text-gris-900">{{ fullName() || '—' }}</dd></div>
    <div><dt class="font-semibold text-gris-500">Teléfono</dt><dd class="mt-1 text-gris-900">{{ profile()?.phone || '—' }}</dd></div>
    <div class="sm:col-span-2"><dt class="font-semibold text-gris-500">Biografía</dt><dd class="mt-1 whitespace-pre-line text-gris-900">{{ profile()?.bio || 'Sin biografía.' }}</dd></div>
  </dl>
</div>
