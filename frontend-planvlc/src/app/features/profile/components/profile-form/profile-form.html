<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-6 rounded-2xl border border-gris-200 bg-white p-5 shadow-sm sm:p-8">
  <div class="grid gap-6 sm:grid-cols-2">
    <div>
      <label for="firstName" class="field-label">Nombre</label>
      <input id="firstName" class="field-input" formControlName="firstName" maxlength="100" />
      @if (fieldError('firstName'); as message) {<p class="field-error">{{ message }}</p>}
    </div>
    <div>
      <label for="lastName" class="field-label">Apellidos</label>
      <input id="lastName" class="field-input" formControlName="lastName" maxlength="100" />
      @if (fieldError('lastName'); as message) {<p class="field-error">{{ message }}</p>}
    </div>
  </div>

  <div>
    <label for="phone" class="field-label">Teléfono</label>
    <input id="phone" type="tel" class="field-input" formControlName="phone" maxlength="30" />
    @if (fieldError('phone'); as message) {<p class="field-error">{{ message }}</p>}
  </div>

  <div>
    <label for="bio" class="field-label">Biografía</label>
    <textarea id="bio" class="field-input min-h-28" formControlName="bio" maxlength="2000"></textarea>
    @if (fieldError('bio'); as message) {<p class="field-error">{{ message }}</p>}
  </div>

  <div class="flex justify-end gap-3 border-t border-gris-100 pt-6">
    <button type="button" (click)="cancelClick.emit()" class="rounded-xl border border-gris-200 bg-white px-5 py-3 font-semibold text-gris-700 shadow-xs hover:bg-gris-50">Cancelar</button>
    <button type="submit" [disabled]="submitting()" class="rounded-xl bg-marca-600 px-5 py-3 font-semibold text-white hover:bg-marca-700 disabled:opacity-60">{{ submitting() ? 'Guardando…' : 'Guardar cambios' }}</button>
  </div>
</form>
