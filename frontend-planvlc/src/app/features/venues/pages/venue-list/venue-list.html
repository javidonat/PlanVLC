<section class="mx-auto max-w-7xl px-4 py-9 sm:px-6 lg:px-8">
  <header class="mb-8 flex flex-wrap items-start justify-between gap-4">
    <div>
      <p class="mb-1 text-sm font-semibold text-marca-600">Panel de administración</p>
      <h1 class="text-3xl font-bold tracking-tight text-gris-900">Lugares</h1>
      <p class="mt-2 text-gris-500">Sitios donde se celebran los planes: salas, estadios, recintos… Un lugar acoge muchos planes.</p>
    </div>
    <a routerLink="nuevo" class="inline-flex items-center gap-2 rounded-xl bg-marca-600 px-5 py-3 font-semibold text-white shadow-sm hover:bg-marca-700"><svg lucidePlus width="18" height="18"></svg> Nuevo lugar</a>
  </header>

  @if (store.loading()) {
    <app-skeleton-loader [count]="5" label="Cargando lugares" />
  } @else if (store.error(); as error) {
    <app-error-state [message]="error" (retry)="load()" />
  } @else if (store.isEmpty()) {
    <app-empty-state message="Todavía no hay lugares." />
  } @else {
    <app-venue-table
      [venues]="store.items()"
      [busyId]="store.busyId()"
      (viewVenue)="onView($event)"
      (editVenue)="onEdit($event)"
      (toggleVenue)="onToggle($event)"
      (deleteVenue)="onDelete($event)"
    />
  }
</section>
