<section class="mx-auto max-w-7xl px-4 py-9 sm:px-6 lg:px-8">
  <header class="mb-8">
    <p class="mb-1 text-sm font-semibold text-marca-600">Panel de administración</p>
    <h1 class="text-3xl font-bold tracking-tight text-gris-900">Opiniones</h1>
    <p class="mt-2 text-gris-500">Valoración media de cada plan y análisis del sentimiento de sus comentarios con IA.</p>
  </header>

  @if (loading()) {
    <app-skeleton-loader [count]="4" label="Cargando opiniones" />
  } @else if (error(); as message) {
    <app-error-state [message]="message" (retry)="load()" />
  } @else if (!items().length) {
    <app-empty-state message="Todavía no hay opiniones en ningún plan." />
  } @else {
    <div class="space-y-4">
      @for (item of items(); track item.planId) {
        <app-plan-reviews-card [item]="item" [analysis]="analyses()[item.planId] ?? null" [loading]="!!analyzing()[item.planId]"
          [error]="analysisErrors()[item.planId] ?? null" (analyze)="onAnalyze($event)" />
      }
    </div>
  }
</section>
