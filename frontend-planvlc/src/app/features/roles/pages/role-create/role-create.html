<section class="mx-auto max-w-3xl px-4 py-9 sm:px-6">
  <a routerLink="/admin/roles" class="text-sm font-semibold text-marca-700 hover:underline">← Volver a roles</a>
  <div class="mb-7 mt-5">
    <p class="text-sm font-semibold text-marca-600">Administración</p>
    <h1 class="mt-2 text-3xl font-bold text-gris-900">Nuevo rol</h1>
    <p class="mt-2 text-gris-500">El nombre se guarda en minúsculas y no se puede repetir.</p>
  </div>

  @if (error()) {<div class="mb-4 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700" role="alert">{{ error() }}</div>}
  <app-role-form
    [submitting]="submitting()"
    [serverErrors]="serverErrors()"
    (formSubmit)="onSubmit($event)"
    (cancelClick)="router.navigate(['/admin/roles'])"
  />
</section>
