<td class="px-5 py-4">
  <p class="font-mono font-semibold text-slate-900">{{ role().name }}</p>
  <p class="mt-1 text-xs text-slate-500">{{ role().description || 'Sin descripción' }}</p>
</td>
<td class="px-5 py-4">
  <div class="flex flex-wrap gap-1.5">
    @for (permission of role().permissions; track permission) {
      <span class="rounded-full bg-slate-100 px-2.5 py-1 font-mono text-xs text-slate-700">{{ permission }}</span>
    } @empty {
      <span class="text-slate-500">Sin permisos</span>
    }
  </div>
</td>
<td class="px-5 py-4">
  @if (role().deletedAt) {
    <span class="rounded-full bg-red-50 px-2.5 py-1 text-xs font-semibold text-red-700">Eliminado</span>
  } @else {
    <button type="button" role="switch" [attr.aria-checked]="role().isActive" [disabled]="busy()" (click)="toggleClick.emit(role())" [attr.aria-label]="(role().isActive ? 'Desactivar ' : 'Activar ') + role().name" [class]="role().isActive ? 'border-emerald-300 bg-emerald-100 text-emerald-800 hover:bg-emerald-200' : 'border-red-300 bg-red-100 text-red-800 hover:bg-red-200'" class="inline-flex min-w-[7rem] cursor-pointer items-center justify-center gap-2 rounded-full border px-4 py-1.5 text-sm font-semibold transition disabled:cursor-wait disabled:opacity-60"><span class="h-2 w-2 rounded-full" [class.bg-emerald-600]="role().isActive" [class.bg-red-600]="!role().isActive"></span>{{ role().isActive ? 'Activo' : 'Inactivo' }}</button>
  }
</td>
<td class="px-5 py-4">
  <div class="flex justify-end gap-2">
    <!-- Ver: disponible siempre, también en roles desactivados o eliminados -->
    <button type="button" (click)="viewClick.emit(role())" class="rounded-lg border border-slate-200 p-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900" [attr.aria-label]="'Ver ' + role().name"><svg lucideEye width="17" height="17"></svg></button>
    @if (!role().deletedAt) {
      <!-- El backend solo deja editar roles activos (PATCH /:id filtra por isActive) -->
      @if (role().isActive) {
        <button type="button" (click)="editClick.emit(role())" class="rounded-lg border border-slate-200 p-2 text-slate-600 hover:bg-blue-50 hover:text-blue-700" [attr.aria-label]="'Editar ' + role().name"><svg lucidePencil width="17" height="17"></svg></button>
      }
      <button type="button" [disabled]="busy()" (click)="deleteClick.emit(role())" class="rounded-lg border border-slate-200 p-2 text-red-600 hover:bg-red-50" [attr.aria-label]="'Eliminar ' + role().name"><svg lucideTrash2 width="17" height="17"></svg></button>
    }
  </div>
</td>
