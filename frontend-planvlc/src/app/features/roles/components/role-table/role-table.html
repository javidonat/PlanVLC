<div class="overflow-x-auto rounded-2xl border border-gris-200 bg-white shadow-sm">
  <table class="min-w-[800px] w-full text-left text-sm">
    <thead class="bg-gris-50 text-[0.8rem] font-semibold text-gris-500">
      <tr>
        <th class="px-5 py-4">Rol</th>
        <th class="px-5 py-4">Permisos</th>
        <th class="px-5 py-4">Disponibilidad</th>
        <th class="px-5 py-4 text-right">Acciones</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gris-100">
      @for (role of roles(); track role._id) {
        <tr app-role-row
          [role]="role"
          [busy]="busyId() === role._id"
          (viewClick)="viewRole.emit($event)"
          (editClick)="editRole.emit($event)"
          (toggleClick)="toggleRole.emit($event)"
          (deleteClick)="deleteRole.emit($event)"
        ></tr>
      }
    </tbody>
  </table>
</div>
