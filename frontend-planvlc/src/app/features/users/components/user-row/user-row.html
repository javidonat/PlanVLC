<td class="px-5 py-4">
  <div class="flex items-center gap-3">
    @if (avatarUrl(); as avatar) {
      <img [src]="avatar" alt="" class="h-10 w-10 shrink-0 rounded-full border border-gris-200 bg-gris-100 object-cover" />
    } @else {
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-gris-100 text-sm font-bold text-gris-500">{{ user().name.charAt(0).toUpperCase() }}</span>
    }
    <div>
      <p class="font-semibold text-gris-900">{{ user().name }}</p>
      <p class="mt-1 text-xs text-gris-500">{{ user().email }}</p>
    </div>
  </div>
</td>
<td class="px-5 py-4"><span class="rounded-full bg-marca-50 px-2.5 py-1 font-mono text-xs font-semibold text-marca-700">{{ roleName(user()) }}</span></td>
<td class="px-5 py-4"><span class="rounded-full bg-gris-100 px-2.5 py-1 text-xs font-semibold text-gris-700">{{ userStatusLabel(user().status) }}</span></td>
<td class="px-5 py-4">
  @if (user().deletedAt) {
    <span class="rounded-full bg-red-50 px-2.5 py-1 text-xs font-semibold text-red-700">Eliminado</span>
  } @else {
    <button type="button" role="switch" [attr.aria-checked]="user().isActive" [disabled]="busy()" (click)="toggleClick.emit(user())" [attr.aria-label]="(user().isActive ? 'Desactivar ' : 'Activar ') + user().name" [class]="user().isActive ? 'border-emerald-300 bg-emerald-100 text-emerald-800 hover:bg-emerald-200' : 'border-red-300 bg-red-100 text-red-800 hover:bg-red-200'" class="inline-flex min-w-[7rem] cursor-pointer items-center justify-center gap-2 rounded-full border px-4 py-1.5 text-sm font-semibold transition disabled:cursor-wait disabled:opacity-60"><span class="h-2 w-2 rounded-full" [class.bg-emerald-600]="user().isActive" [class.bg-red-600]="!user().isActive"></span>{{ user().isActive ? 'Activo' : 'Inactivo' }}</button>
  }
</td>
<td class="px-5 py-4">
  <div class="flex justify-end gap-2">
    <!-- Ver: disponible siempre, también en usuarios desactivados o eliminados -->
    <button type="button" (click)="viewClick.emit(user())" class="rounded-lg border border-gris-200 p-2 text-gris-600 hover:bg-gris-100 hover:text-gris-900" [attr.aria-label]="'Ver ' + user().name"><svg lucideEye width="17" height="17"></svg></button>
    @if (!user().deletedAt) {
      <!-- El backend solo deja editar usuarios activos (PATCH /:id filtra por isActive) -->
      @if (user().isActive) {
        <button type="button" (click)="editClick.emit(user())" class="rounded-lg border border-gris-200 p-2 text-gris-600 hover:bg-marca-50 hover:text-marca-700" [attr.aria-label]="'Editar ' + user().name"><svg lucidePencil width="17" height="17"></svg></button>
      }
      <button type="button" [disabled]="busy()" (click)="deleteClick.emit(user())" class="rounded-lg border border-gris-200 p-2 text-red-600 hover:bg-red-50" [attr.aria-label]="'Eliminar ' + user().name"><svg lucideTrash2 width="17" height="17"></svg></button>
    }
  </div>
</td>
