<section class="mx-auto max-w-3xl px-4 py-9 sm:px-6">
  <a routerLink="/admin/usuarios" class="text-sm font-semibold text-marca-700 hover:underline">← Volver a usuarios</a>
  <div class="mb-7 mt-5 flex flex-wrap items-end justify-between gap-4">
    <div>
      <p class="text-sm font-semibold text-marca-600">Administración</p>
      <h1 class="mt-2 text-3xl font-bold text-gris-900">Editar usuario</h1>
      <p class="mt-2 text-gris-500">{{ user()?.name || 'Completa los datos del usuario.' }}</p>
    </div>
    <!-- Desactivar desde dentro (igual que el interruptor del listado) -->
    @if (user(); as current) {
      <app-active-switch [active]="current.isActive" [busy]="toggling()" [name]="current.name" (toggle)="onDeactivate()" />
    }
  </div>

  @if (pageLoading()) {
    <app-skeleton-loader [count]="4" label="Cargando usuario" />
  } @else if (loadError(); as message) {
    <app-error-state [message]="message" (retry)="loadPage()" />
  } @else if (user(); as current) {
    @if (error()) {<div class="mb-4 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700" role="alert">{{ error() }}</div>}
    <app-user-form
      [user]="current"
      [roles]="roles()"
      [submitting]="submitting()"
      [serverErrors]="serverErrors()"
      (formSubmit)="onSubmit($event)"
      (cancelClick)="router.navigate(['/admin/usuarios'])"
    />
  }
</section>
