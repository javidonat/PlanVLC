<section class="mx-auto max-w-7xl px-4 py-9 sm:px-6 lg:px-8">
  <header class="mb-8 flex flex-wrap items-start justify-between gap-4">
    <div>
      <p class="mb-2 text-xs font-bold uppercase tracking-[.22em] text-blue-600">Panel de administración</p>
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">Usuarios</h1>
      <p class="mt-2 text-slate-500">Usuarios del sistema y su rol. La contraseña se guarda cifrada.</p>
    </div>
    <a routerLink="nuevo" class="inline-flex items-center gap-2 rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white shadow-sm hover:bg-blue-700"><svg lucidePlus width="18" height="18"></svg> Nuevo usuario</a>
  </header>

  @if (store.loading()) {
    <app-skeleton-loader [count]="5" label="Cargando usuarios" />
  } @else if (store.error(); as error) {
    <app-error-state [message]="error" (retry)="load()" />
  } @else if (store.isEmpty()) {
    <app-empty-state message="Todavía no hay usuarios." />
  } @else {
    <app-user-table
      [users]="store.items()"
      [busyId]="store.busyId()"
      (viewUser)="onView($event)"
      (editUser)="onEdit($event)"
      (toggleUser)="onToggle($event)"
      (deleteUser)="onDelete($event)"
    />
  }
</section>
