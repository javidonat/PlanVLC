<section class="mx-auto max-w-3xl px-4 py-9 sm:px-6">
  <a routerLink="/admin/perfiles" class="text-sm font-semibold text-marca-700 hover:underline">← Volver a perfiles</a>
  <div class="mb-7 mt-5">
    <p class="text-sm font-semibold text-marca-600">Administración</p>
    <h1 class="mt-2 text-3xl font-bold text-gris-900">Editar perfil</h1>
    <p class="mt-2 text-gris-500">{{ userName() || 'Completa los datos del perfil.' }}</p>
  </div>

  @if (pageLoading()) {
    <app-skeleton-loader [count]="4" label="Cargando perfil" />
  } @else if (loadError(); as message) {
    <app-error-state [message]="message" (retry)="loadPage()" />
  } @else if (profile(); as current) {
    @if (error()) {<div class="mb-4 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700" role="alert">{{ error() }}</div>}
    <app-profile-form
      [profile]="current"
      [submitting]="submitting()"
      [serverErrors]="serverErrors()"
      (formSubmit)="onSubmit($event)"
      (cancelClick)="router.navigate(['/admin/perfiles'])"
    />
  }
</section>
