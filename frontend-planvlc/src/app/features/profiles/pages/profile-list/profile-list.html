<section class="mx-auto max-w-7xl px-4 py-9 sm:px-6 lg:px-8">
  <header class="mb-6">
    <p class="mb-1 text-sm font-semibold text-marca-600">Panel de administración</p>
    <h1 class="text-3xl font-bold tracking-tight text-gris-900">Perfiles</h1>
    <p class="mt-2 text-gris-500">Datos extendidos de cada usuario. Se activan, desactivan y eliminan junto a su usuario.</p>
  </header>

  <app-list-toolbar
    [search]="store.filters().search"
    searchPlaceholder="Buscar por usuario, nombre o teléfono…"
    [filters]="toolbarFilters()"
    [sortOptions]="sortOptions"
    [sort]="store.filters().sort"
    [resultText]="store.loading() || store.error() ? '' : resultText()"
    [canClear]="store.hasActiveFilters()"
    (searchChange)="onSearch($event)"
    (filterChange)="onFilter($event)"
    (sortChange)="onSort($event)"
    (clear)="onClear()"
  />

  @if (store.loading()) {
    <app-skeleton-loader [count]="5" label="Cargando perfiles" />
  } @else if (store.error(); as error) {
    <app-error-state [message]="error" (retry)="load()" />
  } @else if (store.isEmpty()) {
    <app-empty-state [message]="store.hasActiveFilters() ? 'No hay perfiles con estos filtros.' : 'Todavía no hay perfiles.'" />
  } @else {
    <app-profile-table [profiles]="store.items()" (editProfile)="onEdit($event)" />
    <div class="mt-8">
      <app-pagination [page]="store.pagination().page" [totalPages]="store.pagination().totalPages" (pageChange)="onPage($event)" />
    </div>
  }
</section>
