<section class="mx-auto max-w-7xl px-4 py-9 sm:px-6 lg:px-8">
  <header class="mb-6 flex flex-wrap items-start justify-between gap-4">
    <div>
      <p class="mb-1 text-sm font-semibold text-marca-600">Panel de administración</p>
      <h1 class="text-3xl font-bold tracking-tight text-gris-900">Categorías</h1>
      <p class="mt-2 text-gris-500">Tipos de plan: tardeo, concierto, deporte… Cada plan tiene de 1 a 5 categorías.</p>
    </div>
    <a routerLink="nueva" class="inline-flex items-center gap-2 rounded-xl bg-marca-600 px-5 py-3 font-semibold text-white shadow-sm hover:bg-marca-700"><svg lucidePlus width="18" height="18"></svg> Nueva categoría</a>
  </header>

  <app-list-toolbar
    [search]="store.filters().search"
    searchPlaceholder="Buscar por nombre…"
    [filters]="toolbarFilters()"
    [sortOptions]="sortOptions"
    [sort]="store.filters().sort"
    [resultText]="store.loading() || store.error() ? '' : resultText()"
    [canClear]="store.hasActiveFilters()"
    (searchChange)="onSearch($event)"
    (filterChange)="onFilter($event)"
    (sortChange)="onSort($event)"
    (clear)="onClear()"
  />

  @if (store.loading()) {
    <app-skeleton-loader [count]="5" label="Cargando categorías" />
  } @else if (store.error(); as error) {
    <app-error-state [message]="error" (retry)="load()" />
  } @else if (store.isEmpty()) {
    <app-empty-state [message]="store.hasActiveFilters() ? 'No hay categorías con estos filtros.' : 'Todavía no hay categorías.'" />
  } @else {
    <app-category-table
      [categories]="store.items()"
      [busyId]="store.busyId()"
      (viewCategory)="onView($event)"
      (editCategory)="onEdit($event)"
      (toggleCategory)="onToggle($event)"
      (deleteCategory)="onDelete($event)"
    />
    <div class="mt-8">
      <app-pagination [page]="store.pagination().page" [totalPages]="store.pagination().totalPages" (pageChange)="onPage($event)" />
    </div>
  }
</section>
