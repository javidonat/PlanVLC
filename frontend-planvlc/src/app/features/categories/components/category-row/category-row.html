<td class="px-5 py-4">
  <div class="flex items-center gap-3">
    @if (category().coverImage; as cover) {
      <img [src]="cover.url" alt="" class="h-10 w-10 shrink-0 rounded-lg border border-slate-200 bg-slate-100 object-cover" />
    } @else {
      <span class="h-10 w-10 shrink-0 rounded-lg border border-dashed border-slate-300 bg-slate-50"></span>
    }
    <div>
      <p class="font-semibold text-slate-900">{{ category().name }}</p>
      <p class="mt-1 font-mono text-xs text-slate-500">{{ category().slug }}</p>
    </div>
  </div>
</td>
<td class="px-5 py-4 text-slate-600">{{ categoryGroupLabel(category().group) }}</td>
<td class="px-5 py-4"><span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-700">{{ categoryStatusLabel(category().status) }}</span></td>
<td class="px-5 py-4">
  @if (category().deletedAt) {
    <span class="rounded-full bg-red-50 px-2.5 py-1 text-xs font-semibold text-red-700">Eliminada</span>
  } @else {
    <button type="button" role="switch" [attr.aria-checked]="category().isActive" [disabled]="busy()" (click)="toggleClick.emit(category())" [attr.aria-label]="(category().isActive ? 'Desactivar ' : 'Activar ') + category().name" [class]="category().isActive ? 'border-emerald-300 bg-emerald-100 text-emerald-800 hover:bg-emerald-200' : 'border-red-300 bg-red-100 text-red-800 hover:bg-red-200'" class="inline-flex min-w-[7rem] cursor-pointer items-center justify-center gap-2 rounded-full border px-4 py-1.5 text-sm font-semibold transition disabled:cursor-wait disabled:opacity-60"><span class="h-2 w-2 rounded-full" [class.bg-emerald-600]="category().isActive" [class.bg-red-600]="!category().isActive"></span>{{ category().isActive ? 'Activa' : 'Inactiva' }}</button>
  }
</td>
<td class="px-5 py-4">
  <div class="flex justify-end gap-2">
    <!-- Ver: disponible siempre, también en categorías desactivadas o eliminadas -->
    <button type="button" (click)="viewClick.emit(category())" class="rounded-lg border border-slate-200 p-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900" [attr.aria-label]="'Ver ' + category().name"><svg lucideEye width="17" height="17"></svg></button>
    @if (!category().deletedAt) {
      <!-- El backend solo deja editar categorías activas (PATCH /:id filtra por isActive) -->
      @if (category().isActive) {
        <button type="button" (click)="editClick.emit(category())" class="rounded-lg border border-slate-200 p-2 text-slate-600 hover:bg-blue-50 hover:text-blue-700" [attr.aria-label]="'Editar ' + category().name"><svg lucidePencil width="17" height="17"></svg></button>
      }
      <button type="button" [disabled]="busy()" (click)="deleteClick.emit(category())" class="rounded-lg border border-slate-200 p-2 text-red-600 hover:bg-red-50" [attr.aria-label]="'Eliminar ' + category().name"><svg lucideTrash2 width="17" height="17"></svg></button>
    }
  </div>
</td>
