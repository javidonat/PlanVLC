<header class="sticky top-0 z-40 border-b border-gris-200 bg-white/85 backdrop-blur-md md:ml-64">
  <div class="flex h-16 items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
    <!-- En móvil el logo va aquí; en escritorio está arriba del menú lateral -->
    <a routerLink="/" class="flex items-center gap-2.5 text-xl font-extrabold tracking-tight text-gris-900 md:hidden" aria-label="PlanVLC, ir al inicio">
      <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-marca-500 to-marca-700 text-white shadow-sm" aria-hidden="true"><svg lucideMapPin width="18" height="18"></svg></span>
      <span>Plan<span class="text-marca-600">VLC</span></span>
    </a>
    <p class="hidden items-center gap-2 text-sm text-gris-500 md:flex"><svg lucideMapPin width="16" height="16" class="text-gris-400"></svg> Planes y eventos en Valencia</p>
    <!-- Usuario autenticado: avatar (iniciales), nombre (enlace a su perfil) y logout -->
    @if (store.user(); as user) {
      <nav class="flex items-center gap-1 text-sm font-semibold" aria-label="Navegación principal">
        <a routerLink="/perfil" class="flex items-center gap-2.5 rounded-xl py-1.5 pl-1.5 pr-3 text-gris-700 hover:bg-gris-100">
          <span class="flex h-8 w-8 items-center justify-center rounded-full bg-marca-100 text-xs font-bold text-marca-700" aria-hidden="true">{{ store.initials() }}</span>
          <span class="hidden sm:inline">{{ user.name }}</span>
        </a>
        <button type="button" (click)="logout()" class="flex items-center gap-2 rounded-xl px-3 py-2 text-gris-600 hover:bg-gris-100 hover:text-gris-900">
          <svg lucideLogOut width="17" height="17"></svg><span class="hidden sm:inline">Logout</span>
        </button>
      </nav>
    }
  </div>
</header>
